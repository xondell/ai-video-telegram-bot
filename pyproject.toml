[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-telegram-bot"
version = "0.3.0"
description = "Serverless Telegram audio-to-AI-video bot for Vercel + Supabase"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "google-genai>=2.0.0",
  "fal-client>=0.7.0",
  "SQLAlchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "aiofiles>=24.1",
  "python-dotenv>=1.0",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["supabase*", "tests*", "scripts*"]
